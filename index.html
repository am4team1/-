<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anime Slayer — Web 3D Test</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05050a;color:#fff;font-family:Arial,system-ui}.screen{position:fixed;inset:0;z-index:20;background:radial-gradient(circle at 50% 35%,#241043,#070711 65%);display:flex;align-items:center;justify-content:center}.loader{text-align:center}.logo{font-size:52px;font-weight:900;letter-spacing:3px;text-shadow:0 0 25px #a855f7}.bar{width:360px;height:8px;background:#181322;border-radius:9px;overflow:hidden;margin:22px auto}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7c3aed,#fff);box-shadow:0 0 18px #a855f7}.hint{opacity:.7}.hidden{display:none!important}#game{position:fixed;inset:0}#hud{position:fixed;inset:0;pointer-events:none;z-index:5}.top{position:absolute;top:18px;left:18px;right:18px;display:flex;justify-content:space-between;align-items:flex-start}.card{background:rgba(8,7,15,.75);border:1px solid #7c3aed66;border-radius:14px;backdrop-filter:blur(10px);box-shadow:0 0 25px #0008;padding:12px}.stats{width:310px}.name{font-weight:800;font-size:18px}.meter{height:12px;background:#211827;border-radius:20px;overflow:hidden;margin-top:8px}.meter span{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ef4444,#fb7185);box-shadow:0 0 10px #ef444488}.stam span{background:linear-gradient(90deg,#22d3ee,#60a5fa)}.awake span{background:linear-gradient(90deg,#f59e0b,#fef08a)}.tiny{font-size:11px;opacity:.7;margin-top:5px}.kills{font-weight:800}.skills{position:absolute;bottom:25px;left:50%;transform:translateX(-50%);display:flex;gap:10px;direction:ltr}.skill{width:78px;height:78px;border:1px solid #9b6cff88;border-radius:14px;background:linear-gradient(145deg,#171124dd,#08070ddd);box-shadow:0 0 18px #7c3aed33;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}.skill b{font-size:24px}.skill small{font-size:11px;margin-top:4px;direction:rtl}.skill.cool{opacity:.45}.key{position:absolute;top:5px;left:7px;font-size:10px;color:#c4b5fd}.cross{position:absolute;left:50%;top:50%;width:20px;height:20px;transform:translate(-50%,-50%);opacity:.8}.cross:before,.cross:after{content:"";position:absolute;background:#fff;border-radius:3px}.cross:before{width:2px;height:20px;left:9px}.cross:after{width:20px;height:2px;top:9px}.notice{position:absolute;top:110px;left:50%;transform:translateX(-50%);background:#08070dcc;border:1px solid #a78bfa55;border-radius:12px;padding:10px 16px;opacity:0;transition:.2s}.notice.show{opacity:1}.controls{position:absolute;bottom:18px;right:18px;direction:rtl}.controls div{font-size:12px;opacity:.75}.charbtn{position:absolute;top:18px;right:18px;pointer-events:auto}.btn{cursor:pointer;border:1px solid #8b5cf655;background:#100b1d;color:white;padding:9px 13px;border-radius:10px}.btn:hover{background:#24133c}.modal{position:fixed;inset:0;z-index:30;background:#030308dd;backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:center}.panel{width:min(1000px,94vw);max-height:88vh;overflow:auto;background:#0b0912;border:1px solid #8b5cf677;border-radius:20px;padding:20px;box-shadow:0 0 60px #7c3aed22}.panel h2{margin:0 0 14px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}.char{padding:13px;border-radius:14px;background:#12101b;border:1px solid #ffffff12;cursor:pointer}.char:hover,.char.active{border-color:#a78bfa;box-shadow:0 0 18px #7c3aed33}.dot{width:32px;height:32px;border-radius:50%;margin-bottom:8px;box-shadow:0 0 18px currentColor}.char strong{display:block}.char small{opacity:.6}.footer{display:flex;justify-content:space-between;align-items:center;margin-top:15px}.toast{position:absolute;left:50%;bottom:125px;transform:translateX(-50%);background:#09070fdd;border:1px solid #a78bfa66;border-radius:10px;padding:9px 15px;opacity:0;transition:.2s}.toast.on{opacity:1}
</style></head><body>
<div id="loading" class="screen"><div class="loader"><div class="logo">ANIME SLAYER</div><div class="bar"><i id="loadbar"></i></div><div id="loadtxt" class="hint">Loading Web 3D...</div></div></div>
<canvas id="game"></canvas>
<div id="hud" class="hidden"><div class="top"><div class="card stats"><div class="name" id="pname">Gojo Satoru</div><div class="meter"><span id="hp"></span></div><div class="tiny">HP <b id="hptext">320 / 320</b></div><div class="meter stam"><span id="stam"></span></div><div class="tiny">STAMINA <b id="stamtext">100 / 100</b></div><div class="meter awake"><span id="awake"></span></div><div class="tiny">AWAKENING <b id="awaktext">0%</b></div></div><div class="card kills">☠ Kills: <span id="kills">0</span></div></div><button class="btn charbtn" id="openchars">اختيار الشخصية</button><div class="cross"></div><div class="notice" id="notice"></div><div class="skills" id="skills"></div><div class="controls"><div>WASD — حركة | Shift — Sprint | Space — قفز</div><div>J — M1 | Q E R T — Skills | G — Awakening | C — Characters</div></div><div class="toast" id="toast"></div></div>
<div id="chars" class="modal hidden"><div class="panel"><h2>اختيار الشخصية — 21 Characters</h2><div id="chargrid" class="grid"></div><div class="footer"><span class="tiny">الاختيار يعيد الصحة والـSkills.</span><button class="btn" id="closechars">إغلاق</button></div></div></div>
<script src="https://cdn.babylonjs.com/babylon.js"></script><script>
const chars=[
['Gojo','Gojo Satoru','Blue|Red|Reversal|Hollow Purple','#8b5cf6',320],['Itadori','Itadori Yuji','Rapid Punches|Black Flash|Kick|Divergent Fist','#ef4444',300],['Nobara','Nobara Kugisaki','Nail Throw|Hairpin|Resonance|Straw Doll Barrage','#f472b6',280],['Megumi','Megumi Fushiguro','Shadow Step|Divine Dogs|Shadow Bind|Nue','#6366f1',290],['Sukuna','Ryomen Sukuna','Dismantle|Cleave|Fire Arrow|Malevolent Shrine','#dc2626',380],['Todo','Aoi Todo','Boogie Woogie|Double Strike|Brotherhood|Ultimate Boogie','#f59e0b',350],['Toji','Toji Fushiguro','Heavenly Slash|Rush|Pierce|Playful Cloud','#64748b',360],['Yuta','Yuta Okkotsu','Katana|Rika|Copy|Love Beam','#e2e8f0',330],['Maki','Maki Zenin','Staff Strike|Rush|Weapon Toss|Heavenly Body','#22c55e',320],['Panda','Panda','Gorilla Mode|Panda Rush|Drumming|Core Change','#a3a3a3',340],['Inumaki','Toge Inumaki','Blast Away|Stop|Crush|Cursed Speech','#38bdf8',270],['Nanami','Kento Nanami','Ratio|Collapse|Overtime|Black Flash','#d6b48c',310],['Mahito','Mahito','Transfigured Soul|Body Repel|Clone|Idle Transfiguration','#a855f7',300],['Jogo','Jogo','Ember Insects|Volcano|Flame Burst|Maximum Meteor','#f97316',290],['Hanami','Hanami','Wood Bind|Roots|Flower Field|Disaster Plants','#16a34a',360],['Hakari','Kinji Hakari','Door|Spin|Jackpot|Idle Death Gamble','#eab308',350],['Choso','Choso','Piercing Blood|Supernova|Blood Edge|Flowing Red Scale','#991b1b',320],['Naoya','Naoya Zenin','Projection|Speed Rush|Frame Lock|Mach 3','#06b6d4',300],['Yuki','Yuki Tsukumo','Star Rage|Garuda|Heavy Strike|Black Hole','#f8fafc',370],['Kenjaku','Kenjaku','Curse Manipulation|Gravity|Uzumaki|Antigravity','#7e22ce',340],['Miwa','Kasumi Miwa','New Shadow|Simple Domain|Iaido|Quick Draw','#60a5fa',260]
];
let selected=0, engine,scene,player,cam,keys={},enemies=[],hp=320,maxhp=320,stam=100,awake=0,kills=0,attacking=false,skillCd=[0,0,0,0];
const $=id=>document.getElementById(id), toast=m=>{let e=$('toast');e.textContent=m;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),1200)};
function mat(name,color,em=0){let m=new BABYLON.StandardMaterial(name,scene);m.diffuseColor=BABYLON.Color3.FromHexString(color);m.emissiveColor=BABYLON.Color3.FromHexString(color).scale(em);return m}
function box(name,pos,scale,ma){let b=BABYLON.MeshBuilder.CreateBox(name,{size:1},scene);b.position=pos;b.scaling=scale;b.material=ma;return b}
function makeWorld(){let ground=box('Ground',{x:0,y:-.5,z:0},{x:120,y:1,z:120},mat('ground','#15111f'));for(let x=-50;x<=50;x+=10){for(let z=-50;z<=50;z+=10){if(Math.abs(x)<10&&Math.abs(z)<10)continue;if(Math.random()<.38){let h=3+Math.random()*10,w=3+Math.random()*4;let b=box('Building',{x:x+(Math.random()-.5)*3,y:h/2-.5,z:z+(Math.random()-.5)*3},{x:w,y:h,z:w},mat('b','#242033'));let roof=box('Roof',{x:b.position.x,y:h-.35,z:b.position.z},{x:w*1.05,y:.35,z:w*1.05},mat('roof','#3b2a55',.1));}}}for(let i=0;i<12;i++){let r=4+Math.random()*7,a=i*Math.PI*2/12;let t=box('Torii',{x:Math.cos(a)*r,y:2,z:Math.sin(a)*r},{x:.6,y:4,z:.6},mat('torii','#8b1e3f',.15));box('beam',{x:Math.cos(a)*r,y:3.5,z:Math.sin(a)*r},{x:5,y:.5,z:.6},t.material)}for(let i=0;i<16;i++)spawnEnemy(i)}
function makePlayer(){let c=chars[selected];let root=new BABYLON.TransformNode('Player',scene);let body=BABYLON.MeshBuilder.CreateCapsule('Body',{height:2,radius:.45},scene);body.parent=root;body.position.y=1;body.material=mat('player',c[3],.25);let head=BABYLON.MeshBuilder.CreateSphere('Head',{diameter:.72},scene);head.parent=root;head.position.y=2.2;head.material=mat('skin','#f1c7a8');let aura=BABYLON.MeshBuilder.CreateTorus('Aura',{diameter:2.1,thickness:.035},scene);aura.parent=root;aura.position.y=.8;aura.rotation.x=Math.PI/2;aura.material=mat('aura',c[3],.7);return root}
function spawnEnemy(i){let root=new BABYLON.TransformNode('Enemy',scene);root.position=new BABYLON.Vector3((Math.random()-.5)*70,0,(Math.random()-.5)*70);if(root.position.length()<12)root.position.z+=18;let body=BABYLON.MeshBuilder.CreateCapsule('EnemyBody',{height:2,radius:.5},scene);body.parent=root;body.position.y=1;body.material=mat('enemy','#6d28d9',.1);let head=BABYLON.MeshBuilder.CreateSphere('EnemyHead',{diameter:.7},scene);head.parent=root;head.position.y=2.15;head.material=mat('enemyHead','#d4d4d8');root.metadata={hp:80,max:80,dead:false};enemies.push(root)}
function hit(){if(attacking)return;attacking=true;let forward=new BABYLON.Vector3(Math.sin(player.rotation.y),0,Math.cos(player.rotation.y));let hitAny=false;for(let e of enemies){if(e.metadata.dead)continue;let d=BABYLON.Vector3.Distance(player.position,e.position);let dir=e.position.subtract(player.position);dir.y=0;let dot=BABYLON.Vector3.Dot(forward,dir.normalize());if(d<4.5&&dot>.15){e.metadata.hp-=chars[selected][4]/28;hitAny=true;awake=Math.min(100,awake+3);if(e.metadata.hp<=0){e.metadata.dead=true;kills++;toast('Enemy defeated +1 Kill');setTimeout(()=>{e.position=new BABYLON.Vector3((Math.random()-.5)*70,0,(Math.random()-.5)*70);e.metadata.hp=e.metadata.max;e.metadata.dead=false;e.setEnabled(true)},800)}else e.position.addInPlace(forward.scale(1.2));}}attacking=false;return hitAny}
function skill(i){if(skillCd[i]>0)return toast('Skill on cooldown');let cost=[15,20,25,35][i];if(stam<cost)return toast('Stamina منخفضة');stam-=cost;skillCd[i]=[4,6,8,12][i];awake=Math.min(100,awake+8);let names=chars[selected][2].split('|');toast(names[i]+' ⚡');let forward=new BABYLON.Vector3(Math.sin(player.rotation.y),0,Math.cos(player.rotation.y));for(let e of enemies){if(e.metadata.dead)continue;let d=BABYLON.Vector3.Distance(player.position,e.position);if(d<7+(i*2)){e.metadata.hp-=[25,35,50,90][i];e.position.addInPlace(forward.scale(1.5));if(e.metadata.hp<=0){e.metadata.dead=true;kills++;}}}let p=BABYLON.MeshBuilder.CreateTorus('FX',{diameter:3+i*1.5,thickness:.12},scene);p.position=player.position.add(new BABYLON.Vector3(0,1,0));p.rotation.x=Math.PI/2;p.material=mat('fx',chars[selected][3],1);setTimeout(()=>p.dispose(),350)}
function setup(){engine=new BABYLON.Engine($('game'),true,{preserveDrawingBuffer:true,stencil:true});scene=new BABYLON.Scene(engine);scene.clearColor=BABYLON.Color3.FromHexString('#07060c');let hemi=new BABYLON.HemisphericLight('hemi',new BABYLON.Vector3(0,1,0),scene);hemi.intensity=.8;let point=new BABYLON.PointLight('light',new BABYLON.Vector3(0,8,0),scene);point.diffuse=BABYLON.Color3.FromHexString(chars[selected][3]);point.intensity=25;makeWorld();player=makePlayer();player.position=new BABYLON.Vector3(0,0,0);cam=new BABYLON.FollowCamera('Camera',new BABYLON.Vector3(0,5,-8),scene);cam.lockedTarget=player;cam.radius=8;cam.heightOffset=3;cam.rotationOffset=180;cam.cameraAcceleration=.05;cam.maxCameraSpeed=.4;scene.activeCamera=cam;engine.runRenderLoop(()=>update());window.addEventListener('resize',()=>engine.resize());}
function update(){if(!player)return;let dt=engine.getDeltaTime()/1000;let dir=new BABYLON.Vector3(0,0,0);if(keys.w)dir.z+=1;if(keys.s)dir.z-=1;if(keys.a)dir.x-=1;if(keys.d)dir.x+=1;let sprint=keys.shift&&dir.length()>0;let speed=sprint?11:6;if(sprint&&stam>0)stam=Math.max(0,stam-20*dt);else stam=Math.min(100,stam+14*dt);if(dir.length()>0){dir.normalize();player.position.addInPlace(dir.scale(speed*dt));player.rotation.y=Math.atan2(dir.x,dir.z)}for(let i=0;i<4;i++)if(skillCd[i]>0)skillCd[i]=Math.max(0,skillCd[i]-dt);awake=Math.max(0,awake-.5*dt);for(let e of enemies){if(e.metadata.dead)continue;let d=BABYLON.Vector3.Distance(player.position,e.position);if(d<3){hp=Math.max(0,hp-10*dt);if(hp<=0){hp=maxhp;player.position.set(0,0,0);toast('تم إحياؤك')}}}renderHUD();scene.render()}
function renderHUD(){let c=chars[selected];$('pname').textContent=c[1];$('hp').style.width=(hp/maxhp*100)+'%';$('hptext').textContent=Math.ceil(hp)+' / '+maxhp;$('stam').style.width=stam+'%';$('stamtext').textContent=Math.ceil(stam)+' / 100';$('awake').style.width=awake+'%';$('awaktext').textContent=Math.floor(awake)+'%';$('kills').textContent=kills;document.querySelectorAll('.skill').forEach((e,i)=>{e.classList.toggle('cool',skillCd[i]>0);e.querySelector('small').textContent=chars[selected][2].split('|')[i];e.querySelector('.key').textContent=['Q','E','R','T'][i];});}
function selectChar(i){selected=i;maxhp=chars[i][4];hp=maxhp;awake=0;stam=100;player.dispose();player=makePlayer();player.position=new BABYLON.Vector3(0,0,0);cam.lockedTarget=player;document.querySelectorAll('.char').forEach((e,j)=>e.classList.toggle('active',j===i));$('chars').classList.add('hidden');toast('تم اختيار '+chars[i][1]);}
function buildChars(){let g=$('chargrid');chars.forEach((c,i)=>{let d=document.createElement('div');d.className='char'+(i===0?' active':'');d.innerHTML='<div class="dot" style="color:'+c[3]+';background:'+c[3]+'"></div><strong>'+c[1]+'</strong><small>'+c[2].split('|').slice(0,2).join(' • ')+'</small>';d.onclick=()=>selectChar(i);g.appendChild(d)})}
window.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.repeat)return;if(e.key.toLowerCase()==='j')hit();if(['q','e','r','t'].includes(e.key.toLowerCase()))skill(['q','e','r','t'].indexOf(e.key.toLowerCase()));if(e.key.toLowerCase()==='g'){if(awake>=100){awake=0;toast('AWAKENING ACTIVATED 🔥');for(let e of enemies){if(!e.metadata.dead&&BABYLON.Vector3.Distance(player.position,e.position)<12){e.metadata.hp-=120;if(e.metadata.hp<=0){e.metadata.dead=true;kills++}}}}else toast('Awakening يحتاج 100%')}if(e.key.toLowerCase()==='c')$('chars').classList.toggle('hidden');});window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
$('openchars').onclick=()=>$('chars').classList.remove('hidden');$('closechars').onclick=()=>$('chars').classList.add('hidden');buildChars();let p=0;let int=setInterval(()=>{p+=8;$('loadbar').style.width=Math.min(p,100)+'%';$('loadtxt').textContent=p<40?'Loading map...':p<75?'Loading characters...':'Preparing combat...';if(p>=100){clearInterval(int);setup();setTimeout(()=>{$('loading').classList.add('hidden');$('hud').classList.remove('hidden');},500)}},100);
</script></body></html>
